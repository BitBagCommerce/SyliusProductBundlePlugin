name: Build

on:
    push:
        branches-ignore:
            - 'dependabot/**'
    pull_request: ~
    release:
        types: [created]
    schedule:
        -
            cron: "0 1 * * 6" # Run at 1am every Saturday
    workflow_dispatch: ~

jobs:
    tests:
        runs-on: ubuntu-latest

        name: "Sylius ${{ matrix.sylius }}, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, ${{ matrix.database == 'mysql' && format('MySQL {0}', matrix.mysql_version) || matrix.database == 'postgres' && format('PostgreSQL {0}', matrix.postgres_version) }}"

        strategy:
            fail-fast: false
            matrix:
                php: ["8.3", "8.4"]
                symfony: ["^6.4", "^7.4", "^8.0"]
                sylius: ["~2.2.0", "~2.3.0"]
                node: ["24.x"]
                database: ["mysql"]
                database_version: ["8.4"]

                exclude:
                    # Symfony 8 requires PHP >= 8.4.1
                    -
                        php: "8.3"
                        symfony: "^8.0"

                    # Sylius 2.2 supports Symfony ^6.4 || ~7.4.0 only
                    -
                        sylius: "~2.2.0"
                        symfony: "^8.0"

                include:
                    -
                        php: "8.4"
                        symfony: "^8.0"
                        sylius: "~2.3.0"
                        node: "24.x"
                        database: "mysql"
                        database_version: "8.4"
                    -
                        php: "8.3"
                        symfony: "^7.4"
                        sylius: "~2.2.0"
                        node: "24.x"
                        database: "postgres"
                        database_version: "15.8"
                    -
                        php: "8.3"
                        symfony: "^7.4"
                        sylius: "~2.3.0"
                        node: "24.x"
                        database: "postgres"
                        database_version: "15.8"

        env:
            APP_ENV: test
            DATABASE_URL: ${{ matrix.database == 'mysql' && format('mysql://root:root@127.0.0.1/sylius?serverVersion={0}', matrix.database_version) || format('pgsql://postgres:postgres@127.0.0.1/sylius?serverVersion={0}', matrix.database_version) }}

        steps:
            -
                uses: actions/checkout@v4

            -
                name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "${{ matrix.php }}"
                    extensions: intl
                    tools: symfony
                    coverage: none

            -
                name: Get Composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            -
                name: Cache Composer
                uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json **/composer.lock') }}
                    restore-keys: |
                        ${{ runner.os }}-php-${{ matrix.php }}-composer-
            -
                name: Restrict Symfony version
                if: matrix.symfony != ''
                run: |
                    composer global config --no-plugins allow-plugins.symfony/flex true
                    composer global require --no-progress --no-scripts --no-plugins "symfony/flex:^1.10"
                    composer config extra.symfony.require "${{ matrix.symfony }}"
            -
                name: Restrict Sylius version
                if: matrix.sylius != ''
                run: composer require "sylius/sylius:${{ matrix.sylius }}" --no-update --no-scripts --no-interaction

            -
                name: Configure Composer
                run: composer config prefer-stable true

            -
                name: Build Sylius Test Application
                uses: SyliusLabs/BuildTestAppAction@v3.2.0
                with:
                    e2e_js: "yes"
                    cache_key: "${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}"
                    cache_restore_key: "${{ runner.os }}-php-${{ matrix.php }}-composer-"
                    database: "${{ matrix.database }}"
                    database_version: "${{ matrix.database_version }}"
                    node_version: "${{ matrix.node }}"
                    php_version: "${{ matrix.php }}"
                    sylius_version: "${{ matrix.sylius }}"
                    symfony_version: "${{ matrix.symfony }}"
                    composer_prefer_stable: "yes"

            -
                name: Validate composer.json
                run: composer validate --ansi --strict

            -
                name: Validate database schema
                run: (vendor/bin/console doctrine:schema:validate --skip-sync)

            -
                name: Run PHPStan
                run: vendor/bin/phpstan analyse

            -
                name: Run ECS
                run: vendor/bin/ecs check

            -
                name: Run PHPUnit
                run: vendor/bin/phpunit --colors=always

            -
                name: Run Behat
                run: vendor/bin/behat --colors --strict -vvv --no-interaction -f progress || vendor/bin/behat --colors --strict -vvv --no-interaction -f progress --rerun

            -
                name: Upload test logs
                uses: actions/upload-artifact@v4
                if: failure()
                with:
                    name: "Sylius ${{ matrix.sylius }}, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, MySQL ${{ matrix.mysql }}"
                    path: tests/Application/var/log/
                    if-no-files-found: ignore
                    compression-level: 6
                    overwrite: true
